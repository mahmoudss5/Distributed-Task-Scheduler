services:

  # ─── Infrastructure ────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - distributed-Task-Db:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      # $$ defers expansion to the container; Compose otherwise looks for this
      # value in the shell/root .env instead of backend/.env.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - taskflow-net

  redis:
    image: redis:6.2.6-alpine
    container_name: redis_container
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_container
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # cp-zookeeper enables `srvr` by default but keeps `ruok` disabled.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q 'Mode:'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_container
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"   # External access for local dev tools
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - taskflow-net

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        ensure_partitions() {
          topic="$$1"
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 4 --replication-factor 1
          current=$$(kafka-topics --bootstrap-server kafka:9092 --describe --topic "$$topic" \
            | awk -F'PartitionCount:' '{print $2}' | awk '{print $1}')
          if [ "$${current:-0}" -lt 4 ]; then
            kafka-topics --bootstrap-server kafka:9092 --alter --topic "$$topic" --partitions 4
          fi
        }
        ensure_partitions job-ready
        ensure_partitions job-dlq
    networks:
      - taskflow-net

  # ─── Application Services ──────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    deploy:
      replicas: 4
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      KAFKA_BROKER: kafka:9092
      KAFKA_GROUP_ID: taskflow-workers
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - taskflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_container
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - taskflow-net

# ─── Volumes ────────────────────────────────────────────────────────

volumes:
  distributed-Task-Db:
    driver: local
  redis-data:
    driver: local

# ─── Networks ────────────────────────────────────────────────────────

networks:
  taskflow-net:
    driver: bridge
